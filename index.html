<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Quét Mã Vạch</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; transition: background-color 0.3s; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white;}
    #ketQua { margin-top: 20px; font-size: 24px; font-weight: bold; padding: 15px; border-radius: 8px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .thanh-cong { color: #2e7d32; }
    .that-bai { color: #c62828; }
  </style>
</head>
<body>

  <h2>HỆ THỐNG QUÉT MÃ ĐỘC LẬP</h2>
  <div id="reader"></div>
  <div id="ketQua">Đang chờ quét mã...</div>

  <audio id="amThanhDung" src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" preload="auto"></audio>
  <audio id="amThanhSai" src="https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg" preload="auto"></audio>

  <script>
    let html5QrcodeScanner;
    let dangXuLy = false; 
    
    // THAY LINK WEB APP CỦA BẠN VÀO ĐÂY:
    const GAS_API_URL = "https://script.google.com/a/macros/ballerheadwear.com/s/AKfycbw-oEOo66JqU0Jy43uUAjYWMD0beyyEbjD6FofI0o1sk2_s0TMiXF_JquDe1MgKOVbUog/exec";

    function onScanSuccess(decodedText, decodedResult) {
      if(dangXuLy) return;
      dangXuLy = true;
      
      try { html5QrcodeScanner.pause(); } catch (e) {}

      document.getElementById('ketQua').innerHTML = "Đang kiểm tra dữ liệu...";

      // Gọi API qua Google Apps Script
      fetch(GAS_API_URL + "?maVach=" + encodeURIComponent(decodedText), {
        method: "GET",
        redirect: "follow"
      })
      .then(response => response.json())
      .then(data => xuLyKetQua(data))
      .catch(error => {
        document.getElementById('ketQua').innerHTML = "Lỗi kết nối mạng!";
        setTimeout(khoiPhucTrangThai, 2000);
      });
    }

    function xuLyKetQua(ketQua) {
      let theBody = document.body;
      let theKetQua = document.getElementById('ketQua');

      if (ketQua.thanhCong) {
        theBody.style.backgroundColor = "#4CAF50"; 
        document.getElementById('amThanhDung').play();
        theKetQua.innerHTML = `<span class="thanh-cong">✅ ĐÚNG MÃ: ${ketQua.maVach}</span><br><small>${ketQua.tenSP} (+1)</small>`;
      } else {
        theBody.style.backgroundColor = "#F44336"; 
        document.getElementById('amThanhSai').play();
        theKetQua.innerHTML = `<span class="that-bai">⚠️ SAI MÃ: ${ketQua.maVach}</span>`;
      }

      setTimeout(khoiPhucTrangThai, 2000);
    }

    function khoiPhucTrangThai() {
      document.body.style.backgroundColor = "#f4f4f9";
      document.getElementById('ketQua').innerHTML = "Đang chờ quét mã...";
      dangXuLy = false;
      try { html5QrcodeScanner.resume(); } catch(e) {}
    }

    function onScanFailure(error) { /* Bỏ qua */ }

    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
