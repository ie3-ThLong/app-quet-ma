<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Poka-Yoke Demo</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; transition: background-color 0.2s ease; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; font-size: 24px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .form-group { margin: 20px 0; text-align: left; }
    label { font-weight: bold; color: #555; display: block; margin-bottom: 8px; }
    select, input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
    select:focus, input[type="text"]:focus { border-color: #3498db; outline: none; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 1px solid #ddd; }
    #ketQua { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 15px; border-radius: 6px; background: #f8f9fa; border: 1px dashed #ccc; min-height: 40px; }
    .thanh-cong { color: #2e7d32; }
    .that-bai { color: #c62828; }
  </style>
</head>
<body>

<div class="container">
  <h2>BARCODE POKA-YOKE SYSTEM</h2>
  
  <div class="form-group">
    <label for="selectProduct">CHỌN SẢN PHẨM CẦN</label>
    <select id="selectProduct" onchange="capNhatMaMucTieu()">
      <option value="">-- Đang tải dữ liệu Planning... --</option>
    </select>
  </div>

  <div class="form-group">
    <label>📸 BƯỚC 2: QUÉT MÃ VẠCH (CAMERA HOẶC SÚNG QUÉT)</label>
    <input type="text" id="inputManual" placeholder="Click vào đây để quét hoặc gõ test..." autofocus>
    <div id="reader"></div>
  </div>

  <div id="ketQua">Vui lòng chọn sản phẩm trước.</div>
</div>

<audio id="soundOK" src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" preload="auto"></audio>
<audio id="soundNG" src="https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg" preload="auto"></audio>

<script>
  // ĐẢM BẢO ĐƯỜNG LINK NÀY KẾT THÚC BẰNG /exec
  const GAS_API_URL = "https://script.google.com/a/macros/ballerheadwear.com/s/AKfycbw-oEOo66JqU0Jy43uUAjYWMD0beyyEbjD6FofI0o1sk2_s0TMiXF_JquDe1MgKOVbUog/exec";
  
  let html5QrcodeScanner;
  let dangXuLy = false;
  let maMucTieu = "";
  let tenSPMucTieu = "";
  let planningData = []; // Lưu trữ mảng data để quản lý trạng thái offline trên web

  window.onload = function() {
    taiDuLieuPlanning();
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 180} }, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  };

  function taiDuLieuPlanning() {
    fetch(GAS_API_URL + "?action=getPlanning")
    .then(response => response.json())
    .then(data => {
      planningData = data;
      renderDropdown();
    })
    .catch(err => {
      document.getElementById("ketQua").innerHTML = "❌ Lỗi không thể tải dữ liệu Planning!";
    });
  }

  function renderDropdown() {
    let dropdown = document.getElementById("selectProduct");
    dropdown.innerHTML = '<option value="">-- Chọn sản phẩm đóng gói --</option>';
    planningData.forEach(item => {
      let option = document.createElement("option");
      option.value = item.code;
      option.text = `${item.product} [Mã: ${item.code}] (Đã đóng: ${item.scanned}/${item.quantity})`;
      dropdown.add(option);
    });
  }

  function capNhatMaMucTieu() {
    let dropdown = document.getElementById("selectProduct");
    maMucTieu = dropdown.value;
    let selectedText = dropdown.options[dropdown.selectedIndex].text;
    tenSPMucTieu = selectedText.split(" [Mã:")[0];
    
    // Mở khóa lại ô nhập liệu đề phòng sản phẩm trước đó bị khóa
    document.getElementById("inputManual").disabled = false;
    dangXuLy = false;

    if(maMucTieu) {
      // KIỂM TRA XEM MÃ NÀY TRÊN SHEET ĐÃ ĐỦ SỐ LƯỢNG CHƯA TRƯỚC KHI CHO QUÉT
      let itemHienTai = planningData.find(i => i.code === maMucTieu);
      if (itemHienTai && itemHienTai.scanned >= itemHienTai.quantity) {
        kichHoatCheDoDungQuet(itemHienTai.product, itemHienTai.scanned, itemHienTai.quantity);
        return;
      }
      
      document.getElementById("ketQua").innerHTML = `🎯 Sản phẩm: <b>${tenSPMucTieu}</b><br>`;
      document.getElementById("inputManual").focus();
    } else {
      document.getElementById("ketQua").innerHTML = "Vui lòng chọn sản phẩm trước.";
    }
  }

  function xuLyKiemTraPokaYoke(maQuetDuoc) {
    if (dangXuLy) return;
    if (!maMucTieu) {
      alert("Bạn chưa chọn sản phẩm!");
      return;
    }
    
    dangXuLy = true;
    try { html5QrcodeScanner.pause(); } catch(e) {}
    
    let theBody = document.body;
    let theKetQua = document.getElementById('ketQua');
    let statusLog = (maQuetDuoc.toString().trim() === maMucTieu) ? "OK" : "NG";

    if (statusLog === "OK") {
      theBody.style.backgroundColor = "#2ecc71"; // Xanh lá
      document.getElementById('soundOK').play();
      theKetQua.innerHTML = `✅ ĐÚNG HANGTAG (OK)<br><small>Đang đợi Sheet tự động tính toán lại...</small>`;
    } else {
      theBody.style.backgroundColor = "#e74c3c"; // Đỏ
      document.getElementById('soundNG').play();
      theKetQua.innerHTML = `⚠️ SAI HANGTAG - CẢNH BÁO (NG)<br>Mã quét được: ${maQuetDuoc}`;
    }

    // Bắn log lên Google Sheet, nhận về kết quả tính toán mới tinh từ Sheet
    fetch(`${GAS_API_URL}?action=logScan&maVach=${encodeURIComponent(maQuetDuoc)}&status=${statusLog}`)
    .then(res => res.json())
    .then(ketQuaTuSheet => {
      if(ketQuaTuSheet.success) {
        // Cập nhật lại mảng dữ liệu local trên Web app
        let itemIndex = planningData.findIndex(i => i.code === maQuetDuoc);
        if(itemIndex !== -1) {
          planningData[itemIndex].scanned = ketQuaTuSheet.scannedMoi;
          renderDropdown(); // Vẽ lại dropdown để cập nhật số hiển thị real-time cho sếp xem
          document.getElementById("selectProduct").value = maMucTieu; // Giữ nguyên lựa chọn dropdown
        }

        // 🔥 BIỆN PHÁP POKA YOKE CHỐNG VƯỢT QUÁ SỐ LƯỢNG: NGỪNG QUÉT NẾU ĐỦ SỐ LƯỢNG
        if (ketQuaTuSheet.scannedMoi >= ketQuaTuSheet.quantity && statusLog === "OK") {
          kichHoatCheDoDungQuet(ketQuaTuSheet.tenSP, ketQuaTuSheet.scannedMoi, ketQuaTuSheet.quantity);
          return; // Thoát hẳn luồng, không reset camera nữa
        }
      }
      
      // Nếu chưa đủ số lượng hoặc quét SAI, đợi 2.5s rồi reset cho quét tiếp
      setTimeout(() => {
        theBody.style.backgroundColor = "#f4f4f9";
        capNhatMaMucTieu();
        try { html5QrcodeScanner.resume(); } catch(e) {}
      }, 2500);
    })
    .catch(err => {
      theKetQua.innerHTML = "❌ Lỗi kết nối đồng bộ Sheet!";
      dangXuLy = false;
    });
  }

  // Hàm khóa ứng dụng khi đã hoàn thành mục tiêu
  function kichHoatCheDoDungQuet(tenSP, scanned, target) {
    document.body.style.backgroundColor = "#f1c40f"; // Đổi màn hình sang màu Vàng Cam rực rỡ báo Hoàn thành
    document.getElementById('soundOK').play();
    document.getElementById('ketQua').innerHTML = `🎉 ĐÃ HOÀN THÀNH PACKING 100%!<br>Sản phẩm: <b>${tenSP}</b><br>Số lượng: <b>${scanned}/${target}</b><br>🛑 HỆ THỐNG ĐÃ KHÓA TỰ ĐỘNG, NGỪNG QUÉT!`;
    
    dangXuLy = true; // Khóa lệnh quét từ camera
    document.getElementById("inputManual").disabled = true; // Khóa ô nhập liệu thủ công bằng súng quét
    document.getElementById("inputManual").value = "";
  }

  function onScanSuccess(decodedText, decodedResult) { xuLyKiemTraPokaYoke(decodedText); }
  function onScanFailure(error) {}

  document.getElementById("inputManual").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      let maAn = this.value.trim();
      if(maAn) { xuLyKiemTraPokaYoke(maAn); this.value = ""; }
    }
  });
</script>
</body>
</html>
