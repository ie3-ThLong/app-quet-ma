<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ Thống Barcode Poka-Yoke</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; transition: background-color 0.2s ease; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; font-size: 24px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .form-group { margin: 20px 0; text-align: left; }
    label { font-weight: bold; color: #555; display: block; margin-bottom: 8px; }
    select, input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
    select:focus, input[type="text"]:focus { border-color: #3498db; outline: none; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 1px solid #ddd; }
    #ketQua { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 15px; border-radius: 6px; background: #f8f9fa; border: 1px dashed #ccc; min-height: 40px; }
    .thanh-cong { color: #2e7d32; }
    .that-bai { color: #c62828; }
  </style>
</head>
<body>

<div class="container">
  <h2>BARCODE POKA-YOKE SYSTEM</h2>
  
  <div class="form-group">
    <label for="selectProduct">🎯 BƯỚC 1: CHỌN SẢN PHẨM CẦN PACKING</label>
    <select id="selectProduct" onchange="capNhatMaMucTieu()">
      <option value="">-- Đang tải dữ liệu Planning... --</option>
    </select>
  </div>

  <div class="form-group">
    <label>📸 BƯỚC 2: QUÉT MÃ VẠCH (CAMERA HOẶC SÚNG QUÉT)</label>
    <input type="text" id="inputManual" placeholder="Click vào đây nếu dùng súng quét hoặc gõ tay demo..." autofocus>
    <div id="reader"></div>
  </div>

  <div id="ketQua">Vui lòng chọn sản phẩm mục tiêu trước.</div>
</div>

<audio id="soundOK" src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" preload="auto"></audio>
<audio id="soundNG" src="https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg" preload="auto"></audio>

<script>
  // DÁN ĐƯỜNG LINK WEB APP CỦA BẠN VÀO ĐÂY (ĐẢM BẢO ĐUÔI LÀ /exec)
  const GAS_API_URL = "https://script.google.com/a/macros/ballerheadwear.com/s/AKfycbw-oEOo66JqU0Jy43uUAjYWMD0beyyEbjD6FofI0o1sk2_s0TMiXF_JquDe1MgKOVbUog/exec";
  
  let html5QrcodeScanner;
  let dangXuLy = false;
  let maMucTieu = "";
  let tenSPMucTieu = "";

  // 1. Tự động gọi API lấy dữ liệu Planning khi vừa mở Web lên
  window.onload = function() {
    fetch(GAS_API_URL + "?action=getPlanning")
    .then(response => response.json())
    .then(data => {
      let dropdown = document.getElementById("selectProduct");
      dropdown.innerHTML = '<option value="">-- Chọn sản phẩm đóng gói --</option>';
      data.forEach(item => {
        let option = document.createElement("option");
        option.value = item.code;
        option.text = `${item.product} [Mã: ${item.code}] (Đã đóng: ${item.scanned}/${item.quantity})`;
        dropdown.add(option);
      });
    })
    .catch(err => {
      document.getElementById("ketQua").innerHTML = "❌ Lỗi không thể tải dữ liệu Planning từ Google Sheet!";
    });
    
    // Khởi tạo Camera nhận diện mã vạch
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 180} }, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  };

  // 2. Hàm kích hoạt khi người dùng chọn sản phẩm trên Dropdown
  function capNhatMaMucTieu() {
    let dropdown = document.getElementById("selectProduct");
    maMucTieu = dropdown.value;
    let selectedText = dropdown.options[dropdown.selectedIndex].text;
    tenSPMucTieu = selectedText.split(" [Mã:")[0];
    
    if(maMucTieu) {
      document.getElementById("ketQua").innerHTML = `🎯 Đã khóa mục tiêu: <b>${tenSPMucTieu}</b><br>Vui lòng quét mã sản phẩm để check!`;
      document.getElementById("inputManual").focus();
    } else {
      document.getElementById("ketQua").innerHTML = "Vui lòng chọn sản phẩm mục tiêu trước.";
    }
  }

  // 3. Hàm xử lý khi bắt được tín hiệu mã vạch (Cả Camera và Súng quét đều đổ về đây)
  function xuLyKiemTraPokaYoke(maQuetDuoc) {
    if (dangXuLy) return;
    if (!maMucTieu) {
      alert("Bạn chưa chọn sản phẩm mục tiêu ở Bước 1!");
      return;
    }
    
    dangXuLy = true;
    try { html5QrcodeScanner.pause(); } catch(e) {}
    
    let theBody = document.body;
    let theKetQua = document.getElementById('ketQua');
    let statusLog = "";

    // BIỆN PHÁP POKA YOKE TỨC THỜI TRÊN TRÌNH DUYỆT
    if (maQuetDuoc.toString().trim() === maMucTieu) {
      // TRƯỜNG HỢP ĐÚNG MÃ -> MÀN HÌNH XANH LÁ + TIẾNG TINH
      statusLog = "OK";
      theBody.style.backgroundColor = "#2ecc71"; 
      document.getElementById('soundOK').play();
      theKetQua.innerHTML = `<span class="thanh-cong">✅ ĐÚNG SẢN PHẨM (OK)</span><br>Mã: ${maQuetDuoc}<br><small>Đang đồng bộ lên Google Sheets...</small>`;
    } else {
      // TRƯỜNG HỢP SAI MÃ -> MÀN HÌNH ĐỎ ĐẬM + TIẾNG CÒI HÚ CẢNH BÁO
      statusLog = "NG";
      theBody.style.backgroundColor = "#e74c3c"; 
      document.getElementById('soundNG').play();
      theKetQua.innerHTML = `<span class="that-bai">⚠️ SAI SẢN PHẨM - CẢNH BÁO (NG)</span><br>Mã quét được: ${maQuetDuoc}<br>Mã chuẩn phải là: ${maMucTieu}`;
    }

    // Gửi ngầm dữ liệu nhật ký lên Google Sheet (Không làm chậm giao diện)
    fetch(`${GAS_API_URL}?action=logScan&maVach=${encodeURIComponent(maQuetDuoc)}&status=${statusLog}`)
    .then(res => res.json())
    .then(resData => {
      console.log("Đã lưu lịch sử vào Sheet thành công, ID: " + resData.id);
    })
    .catch(err => console.log("Lỗi đồng bộ Sheet: ", err));

    // Giữ nguyên màu sắc màn hình cảnh báo trong 2.5 giây để nhân viên nhận biết, sau đó tự reset quét mã tiếp theo
    setTimeout(() => {
      theBody.style.backgroundColor = "#f4f4f9";
      capNhatMaMucTieu(); // Trả lại trạng thái chờ ban đầu
      dangXuLy = false;
      try { html5QrcodeScanner.resume(); } catch(e) {}
    }, 2500);
  }

  // Luồng xử lý dành riêng cho CAMERA
  function onScanSuccess(decodedText, decodedResult) {
    xuLyKiemTraPokaYoke(decodedText);
  }
  function onScanFailure(error) { /* Bỏ qua lỗi bắt trượt khung hình */ }

  // Luồng xử lý dành riêng cho SÚNG QUÉT VẬT LÝ HOẶC GÕ TAY DEMO
  document.getElementById("inputManual").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      let maAn = this.value.trim();
      if(maAn) {
        xuLyKiemTraPokaYoke(maAn);
        this.value = ""; // Xóa trắng ô để sẵn sàng lần quét sau
      }
    }
  });
</script>

</body>
</html>
