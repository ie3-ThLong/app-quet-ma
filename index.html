<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Băng Chuyền Poka-Yoke (Fixed-mount Scanner)</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; transition: background-color 0.1s ease; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; font-size: 24px; border-bottom: 2px solid #3498db; padding-bottom: 10px; text-transform: uppercase; }
    .form-group { margin: 20px 0; text-align: left; }
    label { font-weight: bold; color: #555; display: block; margin-bottom: 8px; }
    select, input[type="text"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
    select { background-color: #fdfbfb; cursor: pointer; }
    select:focus { border-color: #3498db; outline: none; }
    
    /* Giao diện nổi bật cho ô nhập liệu máy quét */
    input[type="text"] { background-color: #e8f8f5; border: 2px solid #1abc9c; text-align: center; font-weight: bold; font-size: 20px;}
    input[type="text"]:focus { box-shadow: 0 0 12px rgba(26, 188, 156, 0.6); outline: none; border-color: #16a085;}
    input[type="text"]:disabled { background-color: #ecf0f1; border: 2px solid #bdc3c7; color: #7f8c8d; }
    
    #ketQua { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 20px; border-radius: 8px; background: #f8f9fa; border: 2px dashed #ccc; min-height: 50px; line-height: 1.5; }
    .thanh-cong { color: #2e7d32; font-size: 26px; }
    .that-bai { color: #c62828; font-size: 26px; }
  </style>
</head>
<body>

<div class="container">
  <h2>POKA-YOKE BARCODE</h2>
  
  <div class="form-group">
    <label for="selectProduct">CHỌN SẢN PHẨM ĐANG CHẠY TRÊN CHUYỀN</label>
    <select id="selectProduct" onchange="capNhatMaMucTieu()">
      <option value="">-- Đang tải dữ liệu từ sheet... --</option>
    </select>
  </div>

  <div class="form-group">
    <label>MÁY QUÉT TỰ ĐỘNG ĐỌC MÃ</label>
    <input type="text" id="inputManual" placeholder="Hệ thống đang khóa. Vui lòng chọn sản phẩm trước!" disabled autocomplete="off">
  </div>

  <div id="ketQua">Vui lòng chọn sản phẩm mục tiêu để mở khóa băng chuyền.</div>
</div>

<audio id="soundOK" src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" preload="auto"></audio>
<audio id="soundNG" src="https://actions.google.com/sounds/v1/alarms/buzzer_alarm.ogg" preload="auto"></audio>

<script>
  // DÁN LINK API CỦA BẠN VÀO ĐÂY (ĐUÔI /exec)
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw-oEOo66JqU0Jy43uUAjYWMD0beyyEbjD6FofI0o1sk2_s0TMiXF_JquDe1MgKOVbUog/exec";
  
  let dangXuLy = false;
  let maMucTieu = "";
  let tenSPMucTieu = "";
  let planningData = []; 
  let bgTimer; // Biến quản lý thời gian hiển thị màu nền

  window.onload = function() {
    taiDuLieuPlanning();
  };

  function taiDuLieuPlanning() {
    fetch(GAS_API_URL + "?action=getPlanning")
    .then(response => response.json())
    .then(data => {
      planningData = data;
      renderDropdown();
    })
    .catch(err => {
      document.getElementById("ketQua").innerHTML = "❌ Lỗi mạng: Không thể tải dữ liệu Planning!";
    });
  }

  function renderDropdown() {
    let dropdown = document.getElementById("selectProduct");
    // Lưu lại ID đang chọn để khi re-render không bị mất selection
    let currentSelection = dropdown.value; 
    
    dropdown.innerHTML = '<option value="">-- Click vào đây để chọn sản phẩm --</option>';
    planningData.forEach(item => {
      let option = document.createElement("option");
      option.value = item.code;
      
      // Đánh dấu trực quan trên Dropdown nếu sản phẩm đã đóng đủ
      if(item.scanned >= item.quantity && item.quantity > 0) {
        option.text = `✅ [ĐÃ XONG] ${item.product} (Mã: ${item.code}) - ${item.scanned}/${item.quantity}`;
      } else {
        option.text = `📦 [ĐANG CHẠY] ${item.product} (Mã: ${item.code}) - Đã quét: ${item.scanned}/${item.quantity}`;
      }
      dropdown.add(option);
    });

    if(currentSelection) dropdown.value = currentSelection;
  }

  function capNhatMaMucTieu() {
    let dropdown = document.getElementById("selectProduct");
    maMucTieu = dropdown.value;
    let theBody = document.body;
    let inputEl = document.getElementById("inputManual");
    let ketQuaEl = document.getElementById("ketQua");
    
    // Nếu chọn vào ô trống ban đầu
    if(!maMucTieu) {
      inputEl.disabled = true;
      inputEl.placeholder = "Hệ thống đang khóa. Vui lòng chọn sản phẩm trước!";
      ketQuaEl.innerHTML = "Vui lòng chọn sản phẩm trước.";
      theBody.style.backgroundColor = "#f4f4f9";
      return;
    }

    let selectedText = dropdown.options[dropdown.selectedIndex].text;
    tenSPMucTieu = selectedText.split(" (Mã:")[0].replace("📦 [ĐANG CHẠY] ", "");
    
    // Kiểm tra xem sản phẩm chọn đã hoàn thành chưa
    let itemHienTai = planningData.find(i => i.code === maMucTieu);
    if (itemHienTai && itemHienTai.scanned >= itemHienTai.quantity) {
      kichHoatCheDoDungQuet(itemHienTai.product, itemHienTai.scanned, itemHienTai.quantity);
      return;
    }
    
    // Nếu hợp lệ -> Mở khóa hệ thống sẵn sàng quét
    inputEl.disabled = false;
    dangXuLy = false;
    inputEl.placeholder = "⚡ Băng chuyền đang chạy. Máy quét sẵn sàng!";
    ketQuaEl.innerHTML = `Đang chạy mã: <b>${tenSPMucTieu}</b><br><small>Đợi thùng hàng trôi qua máy quét...</small>`;
    theBody.style.backgroundColor = "#f4f4f9";
    
    // Focus con trỏ vào ô để hứng dữ liệu
    inputEl.focus();
  }

  function xuLyKiemTraPokaYoke(maQuetDuoc) {
    if (dangXuLy) return;
    if (!maMucTieu) return;
    
    // KHÓA NHANH 0.1s CHỐNG MÁY QUÉT BẮN LIÊN THANH 1 MÃ
    dangXuLy = true;
    
    let theBody = document.body;
    let theKetQua = document.getElementById('ketQua');
    let statusLog = (maQuetDuoc.toString().trim() === maMucTieu) ? "OK" : "NG";

    // 1. PHẢN HỒI GIAO DIỆN SIÊU TỐC (Real-time Poka-Yoke)
    if (statusLog === "OK") {
      theBody.style.backgroundColor = "#2ecc71"; // Xanh lá
      let soundOK = document.getElementById('soundOK');
      soundOK.currentTime = 0; 
      soundOK.play();
      theKetQua.innerHTML = `<span class="thanh-cong">✅ ĐÚNG MÃ (${maQuetDuoc})</span>`;
    } else {
      theBody.style.backgroundColor = "#e74c3c"; // Đỏ rực
      let soundNG = document.getElementById('soundNG');
      soundNG.currentTime = 0; 
      soundNG.play();
      theKetQua.innerHTML = `<span class="that-bai">⚠️ SAI MÃ (${maQuetDuoc})</span><br><small>Đã ghi nhận log lỗi cho QC xử lý!</small>`;
    }

    // 2. MỞ KHÓA Ô NHẬP LIỆU NGAY LẬP TỨC ĐỂ ĐÓN THÙNG TIẾP THEO (100ms)
    setTimeout(() => { dangXuLy = false; }, 100);

    // 3. TỰ ĐỘNG RESET TRẠNG THÁI HIỂN THỊ SAU 1 GIÂY NẾU KHÔNG CÓ THÙNG NÀO QUA NỮA
    clearTimeout(bgTimer);
    bgTimer = setTimeout(() => {
      let inputEl = document.getElementById("inputManual");
      if(!inputEl.disabled) {
        theBody.style.backgroundColor = "#f4f4f9";
        theKetQua.innerHTML = `🎯 Đang chạy mã: <b>${tenSPMucTieu}</b><br><small>Đợi thùng hàng trôi qua máy quét...</small>`;
      }
    }, 1000);

    // 4. LUỒNG CHẠY NGẦM: Bắn data về Google Sheets
    fetch(`${GAS_API_URL}?action=logScan&maVach=${encodeURIComponent(maQuetDuoc)}&status=${statusLog}`)
    .then(res => res.json())
    .then(ketQuaTuSheet => {
      if(ketQuaTuSheet.success) {
        // Cập nhật mảng local và vẽ lại Dropdown để số lượng nhảy real-time
        let itemIndex = planningData.findIndex(i => i.code === maQuetDuoc);
        if(itemIndex !== -1) {
          planningData[itemIndex].scanned = ketQuaTuSheet.scannedMoi;
          renderDropdown(); 
        }

        // KIỂM TRA POKA-YOKE TỔNG: NẾU ĐÃ ĐẠT TARGET THÌ DỪNG LẠI
        if (ketQuaTuSheet.scannedMoi >= ketQuaTuSheet.quantity && statusLog === "OK") {
          kichHoatCheDoDungQuet(ketQuaTuSheet.tenSP, ketQuaTuSheet.scannedMoi, ketQuaTuSheet.quantity);
        }
      }
    })
    .catch(err => console.log("Lỗi đồng bộ ngầm, dữ liệu vẫn ở local: ", err));
  }

  // HÀM KHÓA TOÀN BỘ HỆ THỐNG KHI ĐỦ SỐ LƯỢNG
  function kichHoatCheDoDungQuet(tenSP, scanned, target) {
    document.body.style.backgroundColor = "#f1c40f"; // Vàng Cam rực rỡ
    document.getElementById('soundOK').play();
    
    let theKetQua = document.getElementById('ketQua');
    theKetQua.innerHTML = `🎉 <b>ĐÃ ĐÓNG GÓI ĐỦ SỐ LƯỢNG!</b><br>
                           Sản phẩm: <b>${tenSP}</b><br>
                           Hoàn thành: <b>${scanned}/${target}</b><br><br>
                           🛑 <b>VUI LÒNG CHỌN SẢN PHẨM TIẾP THEO Ở MENU BÊN TRÊN ĐỂ TIẾP TỤC</b>`;
    
    dangXuLy = true; // Khóa logic xử lý
    let inputEl = document.getElementById("inputManual");
    inputEl.value = "";
    inputEl.placeholder = "ĐÃ XONG. HÃY CHỌN SẢN PHẨM MỚI Ở TRÊN!";
    inputEl.disabled = true; // Khóa cứng phần cứng không cho bắn mã nữa
    
    // Đổi lại giá trị dropdown về rỗng để bắt người dùng phải thao tác chọn lại
    document.getElementById("selectProduct").value = "";
    maMucTieu = "";
  }

  // XỬ LÝ LỆNH BẮN TỪ MÁY QUÉT FIXED-MOUNT
  document.getElementById("inputManual").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      let maAn = this.value.trim();
      if(maAn) { 
        this.value = ""; // Xóa siêu tốc để chống dính chữ
        xuLyKiemTraPokaYoke(maAn); 
      }
    }
  });

  // TÍNH NĂNG THÔNG MINH CHỐNG MẤT DỮ LIỆU TRÊN BĂNG CHUYỀN
  // Nếu có click chuột bất kỳ đâu (trừ click vào cái Dropdown chọn hàng), tự động hút con trỏ về lại ô quét
  document.addEventListener('click', function(e) {
    let selectEl = document.getElementById("selectProduct");
    let inputEl = document.getElementById("inputManual");
    
    // Nếu không click vào Select box và hệ thống đang mở khóa, giật focus lại!
    if(e.target !== selectEl && !inputEl.disabled) {
      inputEl.focus();
    }
  });

  // Hỗ trợ thêm cho trường hợp Alt+Tab sang phần mềm khác rồi quay lại
  document.getElementById("inputManual").addEventListener('blur', function() {
    let selectEl = document.getElementById("selectProduct");
    if(!this.disabled && document.activeElement !== selectEl) {
      setTimeout(() => this.focus(), 10);
    }
  });
</script>
</body>
</html>
